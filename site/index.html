<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dev-handbook</title>
<script>
(function(){var r=document.documentElement;r.setAttribute("data-host-theme",r.getAttribute("data-theme")||"");
try{var t=localStorage.getItem("dh-theme");if(t==="light"||t==="dark"){r.setAttribute("data-theme",t);}}catch(e){}})();
</script>
<link rel="icon" href="assets/logo-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
 <button type="button" class="menu-btn" id="menu-btn" aria-controls="sidebar" aria-expanded="false" aria-label="Mục lục"><svg width="18" height="14" viewBox="0 0 18 14" aria-hidden="true"><path d="M1 1h16M1 7h16M1 13h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
 <a class="brand" href="#trang-chu"><img src="assets/logo-mark.svg" alt="" width="24" height="24">dev-handbook</a>
 <span class="ver" id="ver"></span>
 <div class="theme" role="group" aria-label="Giao diện">
  <button type="button" id="th-light">Sáng</button><button type="button" id="th-dark">Tối</button><button type="button" id="th-auto">Tự động</button>
 </div>
</header>
<div class="layout">
 <aside class="sidebar" id="sidebar" aria-label="Mục lục">
  <input type="search" id="nav-q" class="nav-q" placeholder="Tìm trang" aria-label="Tìm trang" autocomplete="off">
  <nav id="nav"></nav>
 </aside>
 <div class="scrim" id="scrim"></div>
 <main id="main">
  <div class="page">
   <article id="doc" class="doc"></article>
   <nav class="pager" id="pager" aria-label="Trang trước và sau"></nav>
   <p class="src" id="src"></p>
  </div>
  <aside class="panel" id="panel" aria-label="Bản đồ"></aside>
 </main>
</div>
<script src="content.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js" async id="mermaid-js"></script>
<script src="app.js"></script>
</body>
</html>
